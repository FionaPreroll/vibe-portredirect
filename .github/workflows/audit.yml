name: Security audit (cargo audit)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # New advisories also affect unchanged code, so check regularly.
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: Audit dependencies in Cargo.lock
        run: cargo audit
