name: Security audit (cargo audit)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # New advisories also affect unchanged code, so check regularly.
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      - name: Audit dependencies in Cargo.lock
        run: cargo audit
