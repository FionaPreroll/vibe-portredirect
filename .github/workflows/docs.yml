name: Documentation
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      # The version is pinned: another one may write the module graph differently, which would
      # look like a stale graph. Update it here and run make docs when updating it.
      - name: Install cargo-modules
        run: cargo install --locked cargo-modules@0.27.0
      - name: Check the rendered diagrams
        # Before make docs renders them again: each committed SVG must show what its source says.
        run: utils/check-diagrams.py docs/*.dot
      - name: Build documentation
        run: make docs
      - name: Check the generated diagram sources
        # The module graph must list the current modules. Only the sources are compared: the
        # layout of the SVGs depends on the version of Graphviz.
        run: |
          if ! git diff --exit-code -- 'docs/*.dot'; then
            echo "::error::The module graph is out of date. Run make docs and commit docs/cargo-mods-lib.dot and .svg."
            exit 1
          fi
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portredirect-artifact-docs-directory
          path: docs/
