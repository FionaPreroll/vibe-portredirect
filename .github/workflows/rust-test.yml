name: Rust test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # The runners have IPv6, so its tests must not be skipped.
  PORTREDIRECT_TEST_IPV6: required
jobs:
  test_cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Run tests
        run: make test_cargo ARGS=--locked
