name: Full End-to-End Custom Stress Test (python)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
permissions:
  contents: read
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bats figlet
      - name: Install Pip dependencies
        run: pip install -r utils/requirements.txt
      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
      # It has no sense to run this benchmark if its test is failing
      - name: Run Python Unit Tests
        run: make test_python
      - name: Cargo release build
        run: |
          echo "this is a CI run. delete this file if not. ./.github/workflows and ./tests are using this file." > .ci
          cargo build --release --locked
      - name: Run Big Benchmark
        run: bats --print-output-on-failure --gather-test-outputs-in ./bats-logs tests/full_e2e_connection_stress_test.bats
      - name: Run Data Cruncher for Plots
        run: python3 ./utils/cst_datacruncher.py -o ./testplots ./testlogs/prrs_*/cst_*
      - name: Show Log and Plot Files
        if: always()
        run: |
          echo "========== testlogs =========="
          i=0
          for subdir in ./testlogs/*; do
            echo
            figlet "LOG $i"
            echo "Test log dir: $subdir"
            tail -n+0 "$subdir"/* || true
            i=$((i + 1))
          done

          echo
          echo "========== bats-logs =========="
          figlet "BATS LOGS"
          tail -n+0 ./bats-logs/* || true

          echo
          echo "========== testplots =========="
          figlet "PLOTS"
          ls -l ./testplots || true
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portredirect-artifact-benchmark-custom
          path: |
            ./bats-logs
            ./testlogs
            ./testplots
