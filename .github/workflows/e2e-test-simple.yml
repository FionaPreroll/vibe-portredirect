name: End-to-End Simple Test (iperf3)
# This test checks that portredirect runs and doesn't blatantly crash or exits with an error.
# Also added a debug tmate hook.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bats iperf3
      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
      - name: Cargo release build
        run: |
          echo "this is a CI run. delete this file if not. ./.github/workflows and ./tests are using this file." > .ci
          cargo build --release --locked
      - name: Run BATS test(s)
        # show passing test's output because we only do one test, so no clutter
        run: bats --print-output-on-failure --show-output-of-passing-tests --gather-test-outputs-in ./bats-logs tests/full_e2e_test.bats
      - name: Show Log Files
        if: always()
        run: |
          echo "========== testlogs =========="
          tail -n+0 ./testlogs/*/* || true
      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portredirect-artifact-logs-e2e-test
          path: |
            ./testlogs
            ./bats-logs
