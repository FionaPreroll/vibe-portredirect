name: Fuzzing
on:
  pull_request:
    branches: ["main"]
  schedule:
    # Longer runs find what the short runs on pull requests miss.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each fuzz target for"
        default: "600"
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run each fuzz target
        env:
          # 30 seconds on pull requests, 15 minutes on the weekly run.
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || inputs.seconds || '900' }}
        run: make fuzz FUZZ_SECONDS="$FUZZ_SECONDS"
      - name: Upload the input that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
