name: End-to-End Data Integrity Test (netcat/checksums)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats pv
      - name: Cargo release build
        run: |
          echo "this is a CI run. delete this file if not. ./.github/workflows and ./tests are using this file." > .ci
          cargo build --release --locked
      - name: Run BATS test(s)
        run: bats --print-output-on-failure --gather-test-outputs-in ./bats-logs tests/full_e2e_netcat_checksum.bats
      - name: Show Log Files
        if: always()
        run: |
          echo "========== testlogs =========="
          tail -n+0 ./testlogs/*/* || true
          echo "========== bats-logs =========="
          tail -n+0 ./bats-logs/* || true
      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portredirect-artifact-benchmark-netcatmd5
          path: |
            ./testlogs
            ./bats-logs
