name: Python test (utilities)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  test_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pip dependencies
        run: pip install -r utils/requirements.txt
      - name: Run tests
        run: make test_python
