[package]
name = "portredirect"
version = "0.7.0"
edition = "2021"
rust-version = "1.88.0"
description = "PortRedirect is a tool that bridges your frontend and backend by redirecting TCP connections through a persistent QUIC connection. It provides both a server (accepting TCP connections and forwarding them via QUIC) and a client (relaying QUIC streams to a TCP destination)."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/FionaPreroll/vibe-portredirect"
homepage = "https://github.com/FionaPreroll/vibe-portredirect"
documentation = "https://github.com/FionaPreroll/vibe-portredirect#readme"
keywords = ["tcp", "quic", "networking", "port-forwarding"]
categories = ["network-programming", "command-line-utilities"]

authors = ["Fiona <fipreroll+app@gmail.com>"]

[dependencies]
anyhow = "1.0.97"
chrono = "0.4.40"
clap = { version = "4.5.31", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
prometheus = { version = "0.14.0", default-features = false }
# The default features without platform-verifier: clients trust exactly the server's certificate,
# not the operating system's trust store.
quinn = { version = "0.11.12", default-features = false, features = ["bloom", "futures-io", "log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", features = ["pem", "crypto"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["compat", "rt"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
# cargo-llvm-cov sets cfg(coverage). Code coverage can't see into async functions with
# #[instrument], so they use #[cfg_attr(not(coverage), tracing::instrument(...))] instead.
# cargo fuzz sets cfg(fuzzing), which makes the entry points for fuzzing public, see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(fuzzing)"] }

[dev-dependencies]
tempfile = "3.17.1"
tokio-test = "0.4.4"

[[bin]]
name = "portredirect_server"
path = "src/bin/portredirect_server.rs"

[[bin]]
name = "portredirect_client"
path = "src/bin/portredirect_client.rs"
